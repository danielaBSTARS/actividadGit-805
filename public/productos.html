<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productos - ACTIVIFIT</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      :root {
        --primary: #2563eb;
        --primary-dark: #1e3a8a;
      }

      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #f8fafc;
      }

      /* HERO */
      .hero-activifit {
        background:
          linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)),
          url("https://picsum.photos/id/1015/2000/1200") center/cover no-repeat;
        min-height: 85vh;
        display: flex;
        align-items: center;
        color: white;
        position: relative;
      }

      .new-collection {
        display: inline-block;
        background: rgba(255, 255, 255, 0.95);
        color: #0f172a;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 8px 24px;
        border-radius: 50px;
        letter-spacing: 1px;
      }

      .hero-title {
        font-size: clamp(3rem, 7vw, 4.5rem);
        font-weight: 800;
        line-height: 1.05;
      }

      .btn-hero {
        border-radius: 50px;
        padding: 14px 36px;
        font-weight: 600;
        font-size: 1.1rem;
      }

      /* FILTER BAR */
      .filter-bar {
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        padding: 20px 24px;
        margin: -60px auto 60px;
        max-width: 1200px;
        position: relative;
        z-index: 10;
      }

      /* PRODUCT CARD */
      .product-card {
        background: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.07);
        transition: all 0.3s ease;
        height: 100%;
      }

      .product-card:hover {
        transform: translateY(-12px);
        box-shadow: 0 25px 50px rgba(37, 99, 235, 0.15);
      }

      .product-card-img {
        height: 260px;
        background-size: cover;
        background-position: center;
        position: relative;
      }

      .product-badge {
        position: absolute;
        top: 16px;
        left: 16px;
        padding: 6px 14px;
        border-radius: 50px;
        font-size: 0.75rem;
        font-weight: 700;
        color: white;
      }

      .product-category {
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #64748b;
        padding: 16px 20px 0;
      }

      .product-info {
        padding: 0 20px 20px;
      }

      .product-title {
        font-size: 1.15rem;
        font-weight: 700;
        margin: 8px 0 6px;
      }

      .product-meta {
        color: #64748b;
        font-size: 0.95rem;
      }

      .price {
        font-size: 1.4rem;
        font-weight: 800;
        color: var(--primary-dark);
      }

      .price-old {
        text-decoration: line-through;
        color: #94a3b8;
        font-size: 1.05rem;
      }

      .btn-agregar {
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 50px;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="../index.html">ACTIVIFIT</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="servicios.html">Servicios</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="productos.html">Productos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contactos.html">Contactos</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- HERO -->
    <section class="hero-activifit">
      <div class="container">
        <div class="row justify-content-center text-center">
          <div class="col-lg-8">
            <div class="new-collection mb-4">NUEVA COLECCIÓN 2026</div>
            <h1 class="hero-title">Encuentra tu mejor versión</h1>
            <p class="lead mt-3 mb-4">
              Descubre la nueva colección deportiva diseñada para entrenar con
              comodidad y estilo.
            </p>
            <div class="d-flex justify-content-center gap-3">
              <a href="#product-grid" class="btn btn-hero btn-primary"
                >Comprar Ahora</a
              >
              <a href="#product-grid" class="btn btn-hero btn-outline-light"
                >Ver Colección</a
              >
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Filtros -->
    <div class="container">
      <div class="filter-bar">
        <div class="row g-3">
          <div class="col-lg-4">
            <input
              type="text"
              id="searchInput"
              class="form-control"
              placeholder="🔍 Buscar producto..."
            />
          </div>
          <div class="col-lg-2 col-md-6">
            <select id="categoryFilter" class="form-select">
              <option value="all">Todas las categorías</option>
              <option value="camisetas">Camisetas</option>
              <option value="sudaderas">Sudaderas</option>
              <option value="leggings">Leggings</option>
              <option value="shorts">Shorts</option>
              <option value="tenis">Tenis</option>
              <option value="chaquetas">Chaquetas</option>
            </select>
          </div>
          <div class="col-lg-2 col-md-6">
            <select id="genderFilter" class="form-select">
              <option value="all">Todos</option>
              <option value="hombre">Hombre</option>
              <option value="mujer">Mujer</option>
              <option value="unisex">Unisex</option>
            </select>
          </div>
          <div class="col-lg-2 col-md-6">
            <select id="sizeFilter" class="form-select">
              <option value="all">Tallas</option>
              <option value="xs">XS</option>
              <option value="s">S</option>
              <option value="m">M</option>
              <option value="l">L</option>
              <option value="xl">XL</option>
            </select>
          </div>
          <div class="col-lg-2 col-md-6">
            <select id="sortFilter" class="form-select">
              <option value="default">Ordenar por</option>
              <option value="price-low">Precio: Menor a Mayor</option>
              <option value="price-high">Precio: Mayor a Menor</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Productos -->
    <div class="container pb-5" id="product-grid">
      <div class="row g-4" id="productsContainer"></div>
    </div>

    <!-- Toast -->
    <div
      class="position-fixed bottom-0 end-0 m-4 p-3 rounded-3 shadow text-white"
      id="toast"
      style="background: #1e2937; display: none; z-index: 1050"
    >
      <i class="bi bi-check-circle-fill me-2"></i>
      <span id="toastMessage"></span>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4">
      <div class="container">
        <p class="mb-0">© 2026 ACTIVIFIT. Todos los derechos reservados.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <script>
      const products = [
        {
          id: 1,
          name: "Camiseta Running Pro",
          category: "camisetas",
          gender: "hombre",
          size: "m",
          price: 49.99,
          oldPrice: 59.99,
          image: "https://picsum.photos/id/1015/600/600",
          badge: "nuevo",
          rating: 5,
        },
        {
          id: 2,
          name: "Sudadera Performance",
          category: "sudaderas",
          gender: "unisex",
          size: "l",
          price: 69.99,
          oldPrice: null,
          image: "https://picsum.photos/id/201/600/600",
          badge: null,
          rating: 4,
        },
        {
          id: 3,
          name: "Leggings Fit Mujer",
          category: "leggings",
          gender: "mujer",
          size: "s",
          price: 54.99,
          oldPrice: 64.99,
          image: "https://picsum.photos/id/1027/600/600",
          badge: "oferta",
          rating: 5,
        },
        {
          id: 4,
          name: "Shorts Training",
          category: "shorts",
          gender: "hombre",
          size: "m",
          price: 34.99,
          oldPrice: null,
          image: "https://picsum.photos/id/133/600/600",
          badge: null,
          rating: 4,
        },
        {
          id: 5,
          name: "Tenis Sport X",
          category: "tenis",
          gender: "unisex",
          size: "l",
          price: 119.99,
          oldPrice: 139.99,
          image: "https://picsum.photos/id/180/600/600",
          badge: "nuevo",
          rating: 5,
        },
        {
          id: 6,
          name: "Chaqueta Windbreaker",
          category: "chaquetas",
          gender: "hombre",
          size: "xl",
          price: 89.99,
          oldPrice: null,
          image: "https://picsum.photos/id/251/600/600",
          badge: null,
          rating: 5,
        },
        {
          id: 7,
          name: "Camiseta Dry Fit",
          category: "camisetas",
          gender: "mujer",
          size: "m",
          price: 39.99,
          oldPrice: null,
          image: "https://picsum.photos/id/1015/600/600",
          badge: "oferta",
          rating: 4,
        },
        {
          id: 8,
          name: "Pantalón Jogger",
          category: "sudaderas",
          gender: "unisex",
          size: "l",
          price: 59.99,
          oldPrice: 69.99,
          image: "https://picsum.photos/id/201/600/600",
          badge: null,
          rating: 5,
        },
        {
          id: 9,
          name: "Top Deportivo",
          category: "camisetas",
          gender: "mujer",
          size: "s",
          price: 29.99,
          oldPrice: null,
          image: "https://picsum.photos/id/1027/600/600",
          badge: "nuevo",
          rating: 5,
        },
        {
          id: 10,
          name: "Hoodie Sport",
          category: "sudaderas",
          gender: "hombre",
          size: "xl",
          price: 74.99,
          oldPrice: null,
          image: "https://picsum.photos/id/251/600/600",
          badge: null,
          rating: 4,
        },
        {
          id: 11,
          name: "Licra Compresión",
          category: "leggings",
          gender: "unisex",
          size: "m",
          price: 44.99,
          oldPrice: 54.99,
          image: "https://picsum.photos/id/133/600/600",
          badge: "oferta",
          rating: 5,
        },
        {
          id: 12,
          name: "Chaqueta Impermeable",
          category: "chaquetas",
          gender: "mujer",
          size: "l",
          price: 95.99,
          oldPrice: null,
          image: "https://picsum.photos/id/180/600/600",
          badge: "nuevo",
          rating: 5,
        },
      ];

      function renderProducts(filteredProducts) {
        const container = document.getElementById("productsContainer");
        container.innerHTML = "";

        filteredProducts.forEach((product) => {
          const html = `
                    <div class="col-lg-3 col-md-6 col-12">
                        <div class="product-card">
                            <div class="product-card-img" style="background-image: url('${product.image}')">
                                ${product.badge ? `<span class="product-badge bg-${product.badge === "oferta" ? "danger" : "success"}">${product.badge.toUpperCase()}</span>` : ""}
                            </div>
                            <div class="product-category">${product.category}</div>
                            <div class="product-info">
                                <h5 class="product-title">${product.name}</h5>
                                <p class="product-meta">${product.gender} • Talla ${product.size.toUpperCase()}</p>
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <div>
                                        <span class="price">$${product.price}</span>
                                        ${product.oldPrice ? `<span class="price-old ms-2">$${product.oldPrice}</span>` : ""}
                                    </div>
                                    <div style="color:#fbbf24;">${"★".repeat(product.rating)}</div>
                                </div>
                                <div class="d-flex gap-2">
                                    <button onclick="addToCart(${product.id})" class="btn btn-agregar flex-fill">
                                        <i class="bi bi-cart-plus"></i> Agregar
                                    </button>
                                    <button class="btn btn-outline-secondary flex-fill">Detalles</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
          container.innerHTML += html;
        });
      }

      window.addToCart = function (id) {
        const toast = document.getElementById("toast");
        document.getElementById("toastMessage").textContent =
          "Producto agregado al carrito";
        toast.style.display = "block";
        setTimeout(() => (toast.style.display = "none"), 2500);
      };

      // Filtros
      function filterProducts() {
        const search = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const category = document.getElementById("categoryFilter").value;
        const gender = document.getElementById("genderFilter").value;
        const size = document.getElementById("sizeFilter").value;

        let filtered = products.filter((p) => {
          return (
            p.name.toLowerCase().includes(search) &&
            (category === "all" || p.category === category) &&
            (gender === "all" || p.gender === gender) &&
            (size === "all" || p.size === size)
          );
        });

        renderProducts(filtered);
      }

      document.addEventListener("DOMContentLoaded", () => {
        renderProducts(products);

        document
          .getElementById("searchInput")
          .addEventListener("input", filterProducts);
        document
          .getElementById("categoryFilter")
          .addEventListener("change", filterProducts);
        document
          .getElementById("genderFilter")
          .addEventListener("change", filterProducts);
        document
          .getElementById("sizeFilter")
          .addEventListener("change", filterProducts);
        document
          .getElementById("sortFilter")
          .addEventListener("change", filterProducts);
      });
    </script>
  </body>
</html>
